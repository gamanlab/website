<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Gamanlab</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; background: #0b1d2e; color: #eef3f7; font-family: "Barlow", "Segoe UI", Roboto, Arial, sans-serif; text-align: center; border-top: 3px solid #008081; }
    main { display: grid; gap: 1rem; justify-items: center; max-width: 34rem; }
    img { height: 4rem; width: auto; }
    .tag { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .8rem; letter-spacing: .08em; color: #4fc3c1; }
    h1 { margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: clamp(2rem, 7vw, 3rem); text-transform: uppercase; line-height: 1.05; }
    p { margin: 0; color: #c3ccd3; }
    a.btn { margin-top: .75rem; display: inline-block; text-decoration: none; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.1rem; letter-spacing: .06em; text-transform: uppercase; padding: .7rem 1.4rem; border-radius: 4px; background: #1976d3; color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="Gamanlab">
    <div class="tag">ERR 404 · PAGE NOT FOUND</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Halaman yang Anda cari tidak ada atau sudah dipindahkan. / The page you are looking for does not exist.</p>
    <a class="btn" href="/">Kembali ke beranda / Home</a>
  </main>
</body>
</html>
